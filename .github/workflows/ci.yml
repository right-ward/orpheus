name: CI

on:
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/**'
      - 'gradle.properties'
      - 'app/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-overwrite-existing: true

      - name: Run unit tests
        run: gradle test

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist
          cp "$APK" "dist/Orpheus-debug.apk"
          sha256sum "dist/Orpheus-debug.apk" | tee "dist/Orpheus-debug.apk.sha256"

      - name: Upload debug test APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Orpheus-debug
          path: |
            dist/ShizuLog-debug.apk
            dist/ShizuLog-debug.apk.sha256
          if-no-files-found: error
          retention-days: 3
