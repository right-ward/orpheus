name: Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      action:
        description: Build or release
        required: true
        default: build
        type: choice
        options:
          - build
          - release
      source:
        description: Source branch
        required: true
        type: string
      target:
        description: Architecture
        required: false
        default: aarch64
        type: choice
        options:
          - x86_64
          - aarch64
          - armv7
      release:
        description: Existing release tag
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}-${{ inputs.action }}-${{ inputs.source }}-${{ inputs.target }}-${{ inputs.release }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Android build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_ref: ${{ steps.version.outputs.source_ref }}
      artifact_ref: ${{ steps.version.outputs.artifact_ref }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.ref }}
          fetch-depth: 0

      - name: Validate release target
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'release')
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH; got $RELEASE_TAG"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$ACTION" == "release" ]]; then
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub Release $RELEASE_TAG does not exist."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
              echo "Tag $RELEASE_TAG is not contained in source branch HEAD."
              exit 1
            fi
          else
            main_tip="$(git rev-parse origin/main^{commit})"
            if ! git merge-base --is-ancestor "$tag_commit" "$main_tip"; then
              echo "Tag $RELEASE_TAG does not point to a commit contained in main."
              exit 1
            fi
          fi

      - name: Prepare matrix
        id: matrix
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          matrix='[
            {"target":"x86_64-linux-android","dispatch_target":"x86_64","arch":"x86_64","abi":"x86_64"},
            {"target":"aarch64-linux-android","dispatch_target":"aarch64","arch":"aarch64","abi":"arm64-v8a"},
            {"target":"armv7-linux-androideabi","dispatch_target":"armv7","arch":"armv7","abi":"armeabi-v7a"}
          ]'

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$ACTION" == "build" ]]; then
            matrix="$(jq -c --arg target "$TARGET" 'map(select(.dispatch_target == $target))' <<< "$matrix")"
            if [[ "$matrix" == "[]" ]]; then
              echo "Unsupported Android target: $TARGET"
              exit 1
            fi
          fi

          matrix="$(jq -c . <<< "$matrix")"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Android ${{ matrix.arch }} APK
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-overwrite-existing: true

      - name: Prepare signing keystore
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" || "$ACTION" == "release" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "Android release signing secrets are not configured."
              echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
              exit 1
            fi

            keystore_file="$RUNNER_TEMP/orpheus-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          else
            if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
              keystore_file="$RUNNER_TEMP/orpheus-release.keystore"
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
            else
              keystore_file="$RUNNER_TEMP/orpheus-release.keystore"
              store_password="$(openssl rand -hex 24)"
              key_password="$(openssl rand -hex 24)"
              key_alias="orpheus-ci"
              keytool -genkeypair -noprompt \
                -keystore "$keystore_file" \
                -storepass "$store_password" \
                -keypass "$key_password" \
                -alias "$key_alias" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 1 \
                -dname "CN=Orpheus CI,O=Right Ward,C=XX"

              echo "ANDROID_KEYSTORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"
            fi
          fi

          echo "ANDROID_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"
          if [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"; fi
          if [[ -n "$ANDROID_KEY_ALIAS" ]]; then echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"; fi
          if [[ -n "$ANDROID_KEY_PASSWORD" ]]; then echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"; fi

      - name: Build signed APK
        shell: bash
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        working-directory: android
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/android-packaging-diagnostics.init.gradle" <<'EOF'
          allprojects { project ->
              project.plugins.withId("com.android.application") {
                  project.afterEvaluate {
                      def android = project.extensions.findByName("android")
                      if (android != null) {
                          try {
                              println "[CI][android-packaging] DSL jniLibs.useLegacyPackaging=${android.packaging.jniLibs.useLegacyPackaging}"
                          } catch (Exception e) {
                              println "[CI][android-packaging] Could not read DSL jniLibs.useLegacyPackaging: ${e.class.simpleName}: ${e.message}"
                          }
                      }
                  }

                  def components = project.extensions.findByName("androidComponents")
                  if (components == null) {
                      println "[CI][android-packaging] androidComponents extension not found"
                  } else {
                      println "[CI][android-packaging] androidComponents extension found"
                      components.onVariants(components.selector().withBuildType("release")) { variant ->
                          try {
                              def property = variant.packaging.jniLibs.useLegacyPackaging
                              println "[CI][android-packaging] variant=${variant.name} JniLibsApkPackaging.useLegacyPackaging present=${property.isPresent()} value=${property.isPresent() ? property.get() : '<unset>'}"
                          } catch (Exception e) {
                              println "[CI][android-packaging] Could not read release variant JNI packaging property: ${e.class.simpleName}: ${e.message}"
                          }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon --stacktrace --info --warning-mode all --console=plain             --init-script "$RUNNER_TEMP/android-packaging-diagnostics.init.gradle"             :app:assembleRelease 2>&1 | tee ../android-build.log

          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Expected APK not found: $apk"
            exit 1
          fi

          safe_ref="${{ needs.prepare.outputs.artifact_ref }}"
          safe_ref="${safe_ref//\//-}"
          apk_name="orpheus-${safe_ref}-android-${{ matrix.arch }}.apk"
          cp "$apk" "../$apk_name"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          echo "Created $apk_name" | tee -a ../android-build.log

      - name: Verify APK signature
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "../$APK_NAME"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 3
          archive: false
          overwrite: true

      - name: Archive Android build log
        if: always()
        shell: bash
        run: |
          set +e
          {
            printf '%s\n' \
              "platform=android" \
              "arch=${{ matrix.arch }}" \
              "abi=${{ matrix.abi }}" \
              "target=${{ matrix.target }}" \
              "source_ref=${{ needs.prepare.outputs.source_ref }}" \
              "artifact_ref=${{ needs.prepare.outputs.artifact_ref }}" \
              "version=${{ needs.prepare.outputs.version }}"
            cat android-build.log 2>/dev/null || true
          } > android-build-${{ matrix.arch }}.txt
          tar caf android-build-log-${{ matrix.arch }}.tar.xz android-build-${{ matrix.arch }}.txt

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: android-build-log-${{ matrix.arch }}.tar.xz
          if-no-files-found: error
          retention-days: 3
          archive: false
          overwrite: true

  publish:
    name: Publish Android APKs
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: orpheus-*-android-*.apk
          path: dist
          merge-multiple: true

      - name: Publish APKs and remove legacy Android archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
              break
            fi
            echo "Release $TAG_NAME is not available yet; retrying ($attempt/60)."
            sleep 5
          done

          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Timed out waiting for GitHub Release $TAG_NAME."
            exit 1
          fi

          for asset in \
            "orpheus-${TAG_NAME}-android-x86_64.tar.xz" \
            "orpheus-${TAG_NAME}-android-aarch64.tar.xz" \
            "orpheus-${TAG_NAME}-android-armv7.tar.xz"; do
            gh release delete-asset "$TAG_NAME" "$asset" --yes --repo "$GITHUB_REPOSITORY" || true
          done

